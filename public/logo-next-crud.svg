<svg viewBox="0 0 320 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dégradé doré spéculaire -->
    <linearGradient id="mainGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF6C2" />
      <stop offset="25%" stop-color="#F5B727" />
      <stop offset="50%" stop-color="#FFE082" />
      <stop offset="75%" stop-color="#D49200" />
      <stop offset="100%" stop-color="#9E6900" />
    </linearGradient>

    <!-- Dégradé pour la profondeur -->
    <linearGradient id="depthGold" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#664100" />
      <stop offset="50%" stop-color="#B37800" />
      <stop offset="100%" stop-color="#F5B727" />
    </linearGradient>

    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Symbole Infini (à gauche) -->
  <g transform="translate(6, 4)" filter="url(#logoGlow)">
    <!-- Disque inférieur 3 -->
    <path
      d="M28 32 C 14 32, 6 24, 6 17 C 6 10, 14 4, 28 4 C 41 4, 47 14, 50 17 C 53 14, 59 4, 72 4 C 86 4, 94 10, 94 17 C 94 24, 86 32, 72 32 C 59 32, 53 20, 50 17 C 47 20, 41 32, 28 32 Z"
      transform="translate(0, 14)"
      fill="none"
      stroke="url(#depthGold)"
      stroke-width="5"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.55"
    />

    <!-- Disque intermédiaire 2 -->
    <path
      d="M28 32 C 14 32, 6 24, 6 17 C 6 10, 14 4, 28 4 C 41 4, 47 14, 50 17 C 53 14, 59 4, 72 4 C 86 4, 94 10, 94 17 C 94 24, 86 32, 72 32 C 59 32, 53 20, 50 17 C 47 20, 41 32, 28 32 Z"
      transform="translate(0, 7)"
      fill="none"
      stroke="url(#depthGold)"
      stroke-width="5.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.8"
    />

    <!-- Disque supérieur 1 -->
    <path
      d="M28 32 C 14 32, 6 24, 6 17 C 6 10, 14 4, 28 4 C 41 4, 47 14, 50 17 C 53 14, 59 4, 72 4 C 86 4, 94 10, 94 17 C 94 24, 86 32, 72 32 C 59 32, 53 20, 50 17 C 47 20, 41 32, 28 32 Z"
      fill="none"
      stroke="url(#mainGold)"
      stroke-width="6"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <ellipse cx="28" cy="17" rx="9" ry="5.5" fill="none" stroke="url(#mainGold)" stroke-width="2.5" />
    <ellipse cx="72" cy="17" rx="9" ry="5.5" fill="none" stroke="url(#mainGold)" stroke-width="2.5" />
  </g>

  <!-- Typographie (à droite) : NEXT en blanc zinc épuré, CRUD en or liquide -->
  <text x="120" y="37" font-family="system-ui, -apple-system, sans-serif" font-weight="300" font-size="28" letter-spacing="2" fill="#E4E4E7">NEXT</text>
  <text x="206" y="37" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" letter-spacing="0.5" fill="url(#mainGold)">CRUD</text>
</svg>
